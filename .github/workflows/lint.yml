name: Lint

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  hadolint:
    name: Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: docker/Dockerfile

  shellcheck:
    name: Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: .
          additional_files: docker/start-pdm.sh lxc/setup-lxc.sh

  compose-validate:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose -f docker/docker-compose.yml config --quiet
      - name: Validate traefik override
        run: docker compose -f docker/docker-compose.yml -f docker/docker-compose.traefik.yml config --quiet
