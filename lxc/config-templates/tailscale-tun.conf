# TUN/TAP device access for Tailscale and WireGuard in unprivileged LXC
# This snippet is automatically injected by setup-lxc.sh when --vpn is specified.
# It can also be manually appended to /etc/pve/lxc/<vmid>.conf

lxc.cgroup2.devices.allow: c 10:200 rwm
lxc.mount.entry: /dev/net/tun dev/net/tun none bind,create=file
